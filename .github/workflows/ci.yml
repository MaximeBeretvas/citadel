name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Ubuntu 23.10+ blocks the unprivileged user namespaces Chrome's sandbox needs
      # ("No usable sandbox!"). Lift that on the runner; Citadel keeps the sandbox on natively.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Default features include chrome; the render_js tests use the runner's preinstalled Chrome.
      - run: cargo test --locked
      # Lite build (make install-lite / build-lite) must keep compiling and passing.
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
