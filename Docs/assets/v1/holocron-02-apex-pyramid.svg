<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Holocron — Apex Pyramid">
  <defs>
    <linearGradient id="h2-bg" x1="10" y1="8" x2="118" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a0d12"/>
      <stop offset="100%" stop-color="#090507"/>
    </linearGradient>
    <radialGradient id="h2-glow" cx="64" cy="70" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.52"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h2-left" x1="22" y1="20" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f272b"/>
      <stop offset="100%" stop-color="#180d10"/>
    </linearGradient>
    <linearGradient id="h2-right" x1="64" y1="20" x2="106" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#271418"/>
      <stop offset="100%" stop-color="#0d0608"/>
    </linearGradient>
    <linearGradient id="h2-edge" x1="64" y1="16" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="48%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#h2-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#7f1d1d" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Crimson-amber aura -->
  <circle cx="64" cy="70" r="46" fill="url(#h2-glow)"/>

  <!-- 3D Pyramid faces -->
  <polygon points="64,18 20,86 64,108" fill="url(#h2-left)"/>
  <polygon points="64,18 108,86 64,108" fill="url(#h2-right)"/>

  <!-- Recessed glowing inner energy triangles -->
  <polygon points="64,42 36,83 64,96" fill="#dc2626" fill-opacity="0.28" stroke="#f97316" stroke-opacity="0.7" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="64,42 92,83 64,96" fill="#991b1b" fill-opacity="0.34" stroke="#ef4444" stroke-opacity="0.65" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Geometric circuit inlays -->
  <path d="M51 62 L58 66 L58 84 L46 78" fill="none" stroke="#fb923c" stroke-opacity="0.85" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M77 62 L70 66 L70 84 L82 78" fill="none" stroke="#f87171" stroke-opacity="0.8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Radiant core shard -->
  <polygon points="64,54 71,72 64,84 57,72" fill="#fef08a"/>
  <polygon points="64,54 71,72 64,84" fill="#f97316" opacity="0.65"/>

  <!-- Sharp glowing pyramid wireframe -->
  <polygon points="64,18 108,86 64,108 20,86" fill="none" stroke="url(#h2-edge)" stroke-width="3.25" stroke-linejoin="round"/>
  <line x1="64" y1="18" x2="64" y2="108" stroke="url(#h2-edge)" stroke-width="2.75" stroke-linecap="round"/>

  <!-- Apex capstone gleam -->
  <circle cx="64" cy="18" r="3.5" fill="#fef9c3"/>
</svg>
