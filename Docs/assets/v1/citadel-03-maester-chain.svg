<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Citadel — Maester Chain Seal">
  <defs>
    <linearGradient id="c3-bg" x1="12" y1="6" x2="116" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="c3-ring-gold" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="c3-ring-steel" x1="108" y1="20" x2="20" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#c3-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Maester's multi-metal segmented chain ring -->
  <!-- Gold arc (top-left) -->
  <path d="M23.6 54 A42 42 0 0 1 60 22.2" fill="none" stroke="url(#c3-ring-gold)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Emerald Valyrian-glass arc (top-right) -->
  <path d="M68 22.2 A42 42 0 0 1 104.4 54" fill="none" stroke="#22c55e" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Silver/Steel arc (bottom-right) -->
  <path d="M104.4 74 A42 42 0 0 1 68 105.8" fill="none" stroke="url(#c3-ring-steel)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Bronze/Iron arc (bottom-left) -->
  <path d="M60 105.8 A42 42 0 0 1 23.6 74" fill="none" stroke="#64748b" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Subtle inner seal ring -->
  <circle cx="64" cy="64" r="33" fill="#0e1223" stroke="#334155" stroke-width="1.25"/>

  <!-- Crisp geometric Citadel turret crest inside the seal -->
  <path d="M46 84 L46 47 L52 47 L52 53 L58 53 L58 44 L70 44 L70 53 L76 53 L76 47 L82 47 L82 84 Z" fill="#f8fafc"/>
  <!-- Crown notch & emerald jewel -->
  <rect x="61.5" y="34" width="5" height="5" rx="1" transform="rotate(45 64 36.5)" fill="#22c55e"/>
  <!-- Archway cutout -->
  <path d="M57 84 L57 69 A7 7 0 0 1 71 69 L71 84 Z" fill="#0e1223"/>
  <!-- Lancet slit -->
  <rect x="62.25" y="51" width="3.5" height="9" rx="1.75" fill="#0e1223"/>
  <!-- Base bar -->
  <rect x="42" y="83" width="44" height="4.5" rx="2.25" fill="#cbd5e1"/>
</svg>
