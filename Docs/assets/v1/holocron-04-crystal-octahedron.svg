<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Holocron — Faceted Crystal Octahedron">
  <defs>
    <linearGradient id="h4-bg" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="h4-glow" cx="64" cy="64" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h4-f1" x1="34" y1="18" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="h4-f2" x1="64" y1="18" x2="94" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="h4-f3" x1="34" y1="64" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="h4-f4" x1="64" y1="64" x2="94" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#h4-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#1e3a8a" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Glow -->
  <circle cx="64" cy="64" r="44" fill="url(#h4-glow)"/>

  <!-- Back half of orbital holo-ring -->
  <path d="M22 72 A43 14 -11 0 1 106 56" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>

  <!-- Faceted Octahedron crystal -->
  <!-- Upper-left facet -->
  <polygon points="64,18 34,64 64,72" fill="url(#h4-f1)"/>
  <!-- Upper-right facet -->
  <polygon points="64,18 94,64 64,72" fill="url(#h4-f2)"/>
  <!-- Lower-left facet -->
  <polygon points="34,64 64,72 64,110" fill="url(#h4-f3)"/>
  <!-- Lower-right facet -->
  <polygon points="94,64 64,72 64,110" fill="url(#h4-f4)"/>

  <!-- Crisp specular inner ridge highlights -->
  <line x1="64" y1="18" x2="64" y2="110" stroke="#e0f2fe" stroke-opacity="0.7" stroke-width="1.5"/>
  <polyline points="34,64 64,72 94,64" fill="none" stroke="#bae6fd" stroke-opacity="0.75" stroke-width="1.5"/>
  <polygon points="64,18 94,64 64,110 34,64" fill="none" stroke="#bae6fd" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Central luminous spark -->
  <polygon points="64,54 71,67 64,78 57,67" fill="#ffffff" fill-opacity="0.88"/>

  <!-- Front half of orbital holo-ring -->
  <path d="M106 56 A43 14 -11 0 1 22 72" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="98" cy="66.5" r="3" fill="#e0f2fe"/>
</svg>
