<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Holocron — Jedi Luminous Cube">
  <defs>
    <linearGradient id="h1-bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="h1-glow" cx="64" cy="64" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1-top" x1="64" y1="20" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="h1-left" x1="26" y1="42" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="h1-right" x1="102" y1="42" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#164e63" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="h1-gold" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#h1-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Ambient holo radiance -->
  <circle cx="64" cy="64" r="46" fill="url(#h1-glow)"/>

  <!-- Translucent crystal faces (R=44) -->
  <polygon points="64,20 102.1,42 64,64 25.9,42" fill="url(#h1-top)"/>
  <polygon points="25.9,42 64,64 64,108 25.9,86" fill="url(#h1-left)"/>
  <polygon points="102.1,42 64,64 64,108 102.1,86" fill="url(#h1-right)"/>

  <!-- Glowing inner crystal core (r=18) -->
  <polygon points="64,46 79.6,55 79.6,73 64,82 48.4,73 48.4,55" fill="#ecfeff" fill-opacity="0.32"/>
  <polygon points="64,51 75.3,57.5 64,64 52.7,57.5" fill="#ffffff" fill-opacity="0.9"/>
  <polygon points="52.7,57.5 64,64 64,77 52.7,70.5" fill="#67e8f9" fill-opacity="0.92"/>
  <polygon points="75.3,57.5 64,64 64,77 75.3,70.5" fill="#06b6d4" fill-opacity="0.92"/>

  <!-- Subtle filigree rings on each cube face -->
  <ellipse cx="64" cy="42" rx="14" ry="8" fill="none" stroke="#fef08a" stroke-opacity="0.72" stroke-width="1.6"/>
  <path d="M35 58 L55 69.5 L55 92.5 L35 81 Z" fill="none" stroke="#fef08a" stroke-opacity="0.6" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M93 58 L73 69.5 L73 92.5 L93 81 Z" fill="none" stroke="#eab308" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Gold metallic outer frame & central Y-ribs -->
  <polygon points="64,20 102.1,42 102.1,86 64,108 25.9,86 25.9,42" fill="none" stroke="url(#h1-gold)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M25.9 42 L64 64 L102.1 42 M64 64 L64 108" fill="none" stroke="url(#h1-gold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Corner clasp studs -->
  <circle cx="64" cy="20" r="3" fill="#fef08a"/>
  <circle cx="102.1" cy="42" r="3" fill="#eab308"/>
  <circle cx="102.1" cy="86" r="3" fill="#ca8a04"/>
  <circle cx="64" cy="108" r="3" fill="#a16207"/>
  <circle cx="25.9" cy="86" r="3" fill="#eab308"/>
  <circle cx="25.9" cy="42" r="3" fill="#fef08a"/>
  <circle cx="64" cy="64" r="3.5" fill="#ffffff"/>
</svg>
