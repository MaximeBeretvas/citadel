<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Citadel — High Tower Beacon">
  <defs>
    <linearGradient id="c1-bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c2f"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="c1-glow" cx="64" cy="34" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.48"/>
      <stop offset="48%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1-tower" x1="40" y1="40" x2="88" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="c1-tower-shade" x1="64" y1="40" x2="90" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="c1-flame" x1="64" y1="18" x2="64" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#c1-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#334155" stroke-opacity="0.65" stroke-width="1.5"/>

  <!-- Beacon radiance -->
  <circle cx="64" cy="34" r="46" fill="url(#c1-glow)"/>
  <path d="M40 34 A24 24 0 0 1 88 34" fill="none" stroke="#60a5fa" stroke-opacity="0.28" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M35 38 A29 29 0 0 1 93 38" fill="none" stroke="#60a5fa" stroke-opacity="0.16" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stepped Hightower silhouette -->
  <!-- Base tier -->
  <path d="M34 106 L38 82 L90 82 L94 106 Z" fill="url(#c1-tower)"/>
  <path d="M64 82 L90 82 L94 106 L64 106 Z" fill="url(#c1-tower-shade)" opacity="0.55"/>

  <!-- Mid tier with battlements -->
  <path d="M42 82 L45 60 L50 60 L50 64 L56 64 L56 60 L72 60 L72 64 L78 64 L78 60 L83 60 L86 82 Z" fill="url(#c1-tower)"/>
  <path d="M64 60 L72 60 L72 64 L78 64 L78 60 L83 60 L86 82 L64 82 Z" fill="url(#c1-tower-shade)" opacity="0.5"/>

  <!-- Upper lantern tier -->
  <path d="M51 60 L53 45 L75 45 L77 60 Z" fill="url(#c1-tower)"/>
  <path d="M64 45 L75 45 L77 60 L64 60 Z" fill="url(#c1-tower-shade)" opacity="0.45"/>

  <!-- Brazier platform -->
  <rect x="49" y="42" width="30" height="4" rx="2" fill="#cbd5e1"/>

  <!-- Glowing blue beacon flame -->
  <path d="M64 18 C69 24 72 29 72 34 C72 38.5 68.4 42 64 42 C59.6 42 56 38.5 56 34 C56 29 59 24 64 18 Z" fill="url(#c1-flame)"/>
  <path d="M64 25 C66.8 28.5 68 31.5 68 34.5 C68 37.2 66.2 39 64 39 C61.8 39 60 37.2 60 34.5 C60 31.5 61.2 28.5 64 25 Z" fill="#eff6ff" opacity="0.85"/>

  <!-- Arched windows / lancets -->
  <path d="M61 58 L61 52 A3 3 0 0 1 67 52 L67 58 Z" fill="#0f172a"/>
  <path d="M51 77 L51 70 A2.5 2.5 0 0 1 56 70 L56 77 Z" fill="#0f172a"/>
  <path d="M72 77 L72 70 A2.5 2.5 0 0 1 77 70 L77 77 Z" fill="#0f172a"/>
  <path d="M58 106 L58 93 A6 6 0 0 1 70 93 L70 106 Z" fill="#0f172a"/>
  <!-- Subtle illuminated doorway edge -->
  <path d="M60 106 L60 94 A4 4 0 0 1 68 94 L68 106 Z" fill="#3b82f6" opacity="0.22"/>

  <!-- Crisp foundation plinth -->
  <rect x="28" y="104" width="72" height="5" rx="2.5" fill="#cbd5e1"/>
</svg>
