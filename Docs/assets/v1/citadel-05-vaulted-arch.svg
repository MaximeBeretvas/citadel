<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Citadel — Vaulted Library Arch">
  <defs>
    <linearGradient id="c5-bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="c5-arch" x1="64" y1="18" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="c5-inner" x1="64" y1="28" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#c5-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#475569" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Pointed Gothic Citadel archway (outer stone frame) -->
  <path d="M64 18 C86 30 96 50 96 72 L96 106 L32 106 L32 72 C32 50 42 30 64 18 Z" fill="url(#c5-arch)"/>

  <!-- Recessed inner vaulted library chamber -->
  <path d="M64 30 C79 40 86 55 86 72 L86 106 L42 106 L42 72 C42 55 49 40 64 30 Z" fill="url(#c5-inner)"/>

  <!-- Keystone diamond at the apex -->
  <polygon points="64,13 69,20 64,27 59,20" fill="#22c55e"/>

  <!-- Illuminated knowledge tiers inside the vault -->
  <rect x="52" y="54" width="24" height="5" rx="2.5" fill="#4ade80"/>
  <rect x="48" y="66" width="32" height="5" rx="2.5" fill="#e2e8f0" opacity="0.92"/>
  <rect x="48" y="78" width="22" height="5" rx="2.5" fill="#94a3b8" opacity="0.85"/>
  <rect x="73" y="78" width="7" height="5" rx="2.5" fill="#22c55e"/>
  <rect x="48" y="90" width="32" height="5" rx="2.5" fill="#cbd5e1" opacity="0.75"/>

  <!-- Plinth baseline -->
  <rect x="26" y="102" width="76" height="6" rx="3" fill="#e2e8f0"/>
</svg>
