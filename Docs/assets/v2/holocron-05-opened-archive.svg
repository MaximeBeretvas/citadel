<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Holocron — Opened Archive">
  <title>Holocron — Opened Archive</title>
  <defs>
    <linearGradient id="h5-bg" x1="8" y1="6" x2="120" y2="122" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="h5-beam" x1="0" y1="86" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#h5-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#334155" stroke-width="1.5"/>
  <!-- Tilted lid lifted off an open cube; knowledge lines rise out of the green interior -->
  <polygon points="40,72 64,86 88,72 84,34 44,34" fill="url(#h5-beam)"/>
  <polygon points="64,58 88,72 64,86 40,72" fill="#14532d"/>
  <polygon points="40,72 64,86 64,106 40,92" fill="#cbd5e1"/>
  <polygon points="88,72 64,86 64,106 88,92" fill="#475569"/>
  <g stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round">
    <line x1="57" y1="50" x2="71" y2="50"/>
    <line x1="53" y1="58" x2="75" y2="58"/>
  </g>
  <g transform="rotate(-10 64 32)">
    <polygon points="42,30 64,42 64,46 42,34" fill="#cbd5e1"/>
    <polygon points="86,30 64,42 64,46 86,34" fill="#94a3b8"/>
    <polygon points="64,18 86,30 64,42 42,30" fill="#f8fafc"/>
