  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#c3-bg)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
