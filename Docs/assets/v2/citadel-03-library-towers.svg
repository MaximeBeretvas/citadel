  <path d="M78,50 H85 V58 H91 V50 H98 V102 H78 Z" fill="#0f172a"/>
  <g stroke="#f8fafc" stroke-opacity="0.75" stroke-width="2.5"><line x1="78" y1="66" x2="98" y2="66"/><line x1="78" y1="92" x2="98" y2="92"/></g>
  <rect x="24" y="100" width="80" height="8" rx="3" fill="#0f172a"/>
